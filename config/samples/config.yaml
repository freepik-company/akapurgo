---
server:
  listen_address: "127.0.0.1:8080"
  #config:
  #  read_buffer_size: 16384
akamai:
  host: "https://akamai.example.com"
  client_secret: "your-client-secret"
  client_token: "your-client-token"
  access_token: "your-access-token"

post_purge_request:
  enabled: true
  # The request runs before the Akamai API purge. Akamai can use its headers to
  # resolve the public URL and invalidate a private origin cache first.
  timeout_seconds: 10
  # Required allowlist: prevents arbitrary server-side requests and token leaks.
  allowed_hosts:
    - "img.example.com"
  # Defaults to "akapurgo". Akamai rejects Go's default User-Agent with a 403.
  #user_agent: "akapurgo"
  headers:
    X-OVH-Purge: "$OVH_PURGE_TOKEN"

logs:
  show_access_logs: true
  jwt_user:
    enabled: true
    header: "Cookie"
    jwt_field: "email"
  access_logs_fields:
    - REQUEST:method
    - REQUEST:host
    - REQUEST:path
    - REQUEST:proto
    - REQUEST:referer
    - REQUEST:body

    - REQUEST_HEADER:user-agent
    - REQUEST_HEADER:x-forwarded-for
    - REQUEST_HEADER:x-real-ip

    - RESPONSE:status

    - RESPONSE_HEADER:content-length