---
server:
  listen_address: "127.0.0.1:8080"
  #config:
  #  read_buffer_size: 16384
akamai:
  host: "https://akamai.example.com"
  client_secret: "your-client-secret"
  client_token: "your-client-token"
  access_token: "your-access-token"

post_purge_request:
  enabled: true
  # Optional. Defaults to "akapurgo". Some CDNs (Akamai among them) reject the
  # Go default User-Agent with a 403, so the request never reaches the origin.
  #user_agent: "akapurgo"
  headers:
    X-Custom-Header: "value"

# Optional direct purge for private origin caches. The API caller supplies the
# storage keys in originCachePurge; endpoints and credentials stay server-side.
# This runs before the Akamai purge so Akamai cannot refill from stale origin data.
origin_cache_purge:
  enabled: false
  endpoints:
    - "https://192.0.2.10/_cache_purge"
    - "https://192.0.2.11/_cache_purge"
    - "https://192.0.2.12/_cache_purge"
  # Required environment variable when this feature is enabled.
  token: "$ORIGIN_CACHE_PURGE_TOKEN"
  # Per-endpoint timeout and total budget for all entries and endpoints.
  timeout_seconds: 10
  total_timeout_seconds: 30
  # Direct-IP endpoints may use hostname certificates. Enable only when the
  # network path is trusted and certificate verification cannot be configured.
  insecure_skip_tls_verify: false

logs:
  show_access_logs: true
  jwt_user:
    enabled: true
    header: "Cookie"
    jwt_field: "email"
  access_logs_fields:
    - REQUEST:method
    - REQUEST:host
    - REQUEST:path
    - REQUEST:proto
    - REQUEST:referer
    - REQUEST:body

    - REQUEST_HEADER:user-agent
    - REQUEST_HEADER:x-forwarded-for
    - REQUEST_HEADER:x-real-ip

    - RESPONSE:status

    - RESPONSE_HEADER:content-length